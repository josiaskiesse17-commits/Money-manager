<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Money Manager - Personal finance tracking for CDF and USD">
  <meta name="theme-color" content="#0F5FA8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Manager">
  <link rel="apple-touch-icon" href="icons/splash-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/splash-192.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <title>Money Manager</title>

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0F5FA8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    #splash img {
      max-width: 80%;
      max-height: 60vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #splash-branding {
      margin-top: 16px;
      color: rgba(255, 255, 255, 0.8);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      text-align: center;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById('splash');
      const branding = document.getElementById('splash-branding');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.3s ease-out';
        setTimeout(() => splash.remove(), 300);
      }
      if (branding) {
        branding.style.opacity = '0';
        branding.style.transition = 'opacity 0.3s ease-out';
        setTimeout(() => branding.remove(), 300);
      }
      document.body.style.background = 'transparent';
    }

    // Fallback: remove splash after a reasonable timeout if Flutter doesn't
    setTimeout(() => {
      if (document.getElementById('splash')) {
        console.warn('Flutter took too long to initialize, removing splash');
        removeSplashFromWeb();
      }
    }, 10000);
  </script>
</head>
<body>
  <div id="splash">
    <img src="icons/splash-512.png" alt="Money Manager">
    <div id="splash-branding">Money Manager</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>

</body></html>
