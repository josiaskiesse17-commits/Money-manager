name: money_manager
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0
  fl_chart: ^0.69.0
  pdf: ^3.11.0
  printing: ^5.12.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  intl: ^0.19.0
  google_sign_in: ^6.2.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: 'assets/icon/cleaned/app_icon.png'
  adaptive_icon_background: '#0F5FA8'
  adaptive_icon_foreground: 'assets/icon/cleaned/app_icon.png'

flutter_native_splash:
  color: '#0F5FA8'
  android: true
  ios: true
  android_12:
    image: 'assets/icon/cleaned/logo.png'
    color: '#0F5FA8'
  web: true
  image: 'assets/icon/cleaned/logo.png'